<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="700" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:0.2" />
    </linearGradient>
    <radialGradient id="circle-gradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#3498db;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Base Background -->
  <rect width="700" height="400" fill="url(#bg-gradient)" />
  
  <!-- Decorative Elements -->
  <!-- Circles -->
  <circle cx="100" cy="80" r="60" fill="url(#circle-gradient)" />
  <circle cx="600" cy="320" r="80" fill="url(#circle-gradient)" />
  <circle cx="350" cy="200" r="150" fill="url(#circle-gradient)" opacity="0.3" />
  
  <!-- Lines Pattern -->
  <g stroke="#3498db" stroke-width="1" opacity="0.2">
    <!-- Horizontal lines -->
    <line x1="0" y1="50" x2="700" y2="50" />
    <line x1="0" y1="100" x2="700" y2="100" />
    <line x1="0" y1="150" x2="700" y2="150" />
    <line x1="0" y1="200" x2="700" y2="200" />
    <line x1="0" y1="250" x2="700" y2="250" />
    <line x1="0" y1="300" x2="700" y2="300" />
    <line x1="0" y1="350" x2="700" y2="350" />
    
    <!-- Vertical lines -->
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="500" y1="0" x2="500" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
  </g>
  
  <!-- E-commerce Icons -->
  <!-- Shopping Cart -->
  <g transform="translate(150, 120) scale(0.6)" opacity="0.8" fill="#3498db">
    <circle cx="40" cy="90" r="10" />
    <circle cx="80" cy="90" r="10" />
    <path d="M0,10 L20,10 L30,50 L90,50 L100,20 L40,20" stroke="#3498db" stroke-width="5" fill="none" />
    <path d="M30,50 L40,90" stroke="#3498db" stroke-width="5" fill="none" />
    <path d="M90,50 L80,90" stroke="#3498db" stroke-width="5" fill="none" />
  </g>
  
  <!-- Package Box -->
  <g transform="translate(480, 150) scale(0.6)" opacity="0.8" fill="#3498db">
    <rect x="10" y="30" width="80" height="60" />
    <path d="M10,30 L50,10 L90,30" stroke="#3498db" stroke-width="5" fill="none" />
    <path d="M50,10 L50,90" stroke="#3498db" stroke-width="5" fill="none" />
    <path d="M90,30 L90,90 L10,90 L10,30" stroke="#3498db" stroke-width="5" fill="none" />
  </g>
  
  <!-- Mobile Device -->
  <g transform="translate(280, 280) scale(0.5)" opacity="0.8">
    <rect x="20" y="10" width="60" height="100" rx="10" ry="10" stroke="#3498db" stroke-width="5" fill="none" />
    <circle cx="50" cy="90" r="10" stroke="#3498db" stroke-width="3" fill="none" />
    <line x1="35" y1="30" x2="65" y2="30" stroke="#3498db" stroke-width="3" />
    <line x1="35" y1="40" x2="65" y2="40" stroke="#3498db" stroke-width="3" />
    <line x1="35" y1="50" x2="65" y2="50" stroke="#3498db" stroke-width="3" />
    <line x1="35" y1="60" x2="65" y2="60" stroke="#3498db" stroke-width="3" />
  </g>
  
  <!-- Credit Card -->
  <g transform="translate(480, 320) scale(0.5)" opacity="0.8">
    <rect x="10" y="20" width="80" height="50" rx="5" ry="5" stroke="#3498db" stroke-width="3" fill="none" />
    <rect x="20" y="50" width="40" height="10" stroke="#3498db" stroke-width="2" fill="none" />
    <line x1="20" y1="40" x2="60" y2="40" stroke="#3498db" stroke-width="2" />
  </g>
</svg>