<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="600" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="500" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="300" y="40" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold" fill="#2c3e50">ShopSleek Three-Tier Architecture</text>
  
  <!-- Tier Boxes -->
  <!-- Presentation Layer -->
  <rect x="100" y="80" width="400" height="100" fill="#3498db" rx="10" ry="10" />
  <text x="300" y="110" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold" fill="white">Presentation Layer</text>
  <!-- Components -->
  <rect x="130" y="130" width="100" height="30" fill="white" rx="5" ry="5" stroke="#2980b9" />
  <text x="180" y="150" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">User Interface</text>
  <rect x="250" y="130" width="100" height="30" fill="white" rx="5" ry="5" stroke="#2980b9" />
  <text x="300" y="150" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">Admin Dashboard</text>
  <rect x="370" y="130" width="100" height="30" fill="white" rx="5" ry="5" stroke="#2980b9" />
  <text x="420" y="150" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">Vendor Portal</text>
  
  <!-- Application Layer -->
  <rect x="100" y="200" width="400" height="130" fill="#2ecc71" rx="10" ry="10" />
  <text x="300" y="230" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold" fill="white">Application Layer</text>
  <!-- Components -->
  <rect x="130" y="250" width="100" height="30" fill="white" rx="5" ry="5" stroke="#27ae60" />
  <text x="180" y="270" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">User Management</text>
  <rect x="250" y="250" width="100" height="30" fill="white" rx="5" ry="5" stroke="#27ae60" />
  <text x="300" y="270" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">Product Catalog</text>
  <rect x="370" y="250" width="100" height="30" fill="white" rx="5" ry="5" stroke="#27ae60" />
  <text x="420" y="270" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">Shopping Cart</text>
  <rect x="130" y="290" width="100" height="30" fill="white" rx="5" ry="5" stroke="#27ae60" />
  <text x="180" y="310" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">Order Processing</text>
  <rect x="250" y="290" width="100" height="30" fill="white" rx="5" ry="5" stroke="#27ae60" />
  <text x="300" y="310" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">Payment Gateway</text>
  <rect x="370" y="290" width="100" height="30" fill="white" rx="5" ry="5" stroke="#27ae60" />
  <text x="420" y="310" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">Analytics Engine</text>
  
  <!-- Data Layer -->
  <rect x="100" y="350" width="400" height="100" fill="#e74c3c" rx="10" ry="10" />
  <text x="300" y="380" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold" fill="white">Data Layer</text>
  <!-- Components -->
  <rect x="140" y="400" width="140" height="30" fill="white" rx="5" ry="5" stroke="#c0392b" />
  <text x="210" y="420" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">MySQL Database</text>
  <rect x="320" y="400" width="140" height="30" fill="white" rx="5" ry="5" stroke="#c0392b" />
  <text x="390" y="420" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">File Storage</text>
  
  <!-- Connecting Lines -->
  <!-- Presentation to Application -->
  <line x1="300" y1="180" x2="300" y2="200" stroke="#34495e" stroke-width="2" stroke-dasharray="5,5" />
  <!-- Application to Data -->
  <line x1="300" y1="330" x2="300" y2="350" stroke="#34495e" stroke-width="2" stroke-dasharray="5,5" />
  
  <!-- Technology Stack -->
  <rect x="100" y="470" width="400" height="20" fill="#9b59b6" rx="5" ry="5" />
  <text x="300" y="485" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="white">React.js | Node.js | Express.js | MySQL | HostingRaja</text>
</svg>