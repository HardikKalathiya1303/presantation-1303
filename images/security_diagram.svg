<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="700" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="700" height="500" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="350" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold" fill="#2c3e50">ShopSleek Security Architecture</text>
  
  <!-- Main Security Shield in Center -->
  <g transform="translate(320, 240)">
    <path d="M0,-120 L60,-100 L60,60 L0,100 L-60,60 L-60,-100 Z" fill="#3498db" fill-opacity="0.2" stroke="#2980b9" stroke-width="3" />
    <path d="M0,-100 L50,-85 L50,50 L0,85 L-50,50 L-50,-85 Z" fill="#3498db" fill-opacity="0.3" stroke="#2980b9" stroke-width="2" />
    <text x="0" y="0" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#2c3e50">Core</text>
    <text x="0" y="25" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#2c3e50">Security</text>
  </g>
  
  <!-- Security Layers around Shield -->
  <!-- User Authentication -->
  <g transform="translate(180, 120)">
    <circle cx="0" cy="0" r="50" fill="#3498db" fill-opacity="0.2" stroke="#2980b9" stroke-width="2" />
    <text x="0" y="-10" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#2c3e50">User</text>
    <text x="0" y="10" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#2c3e50">Authentication</text>
    <line x1="40" y1="20" x2="100" y2="80" stroke="#2980b9" stroke-width="2" stroke-dasharray="5,3" />
  </g>
  
  <!-- Data Encryption -->
  <g transform="translate(480, 120)">
    <circle cx="0" cy="0" r="50" fill="#e74c3c" fill-opacity="0.2" stroke="#c0392b" stroke-width="2" />
    <text x="0" y="-10" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#2c3e50">Data</text>
    <text x="0" y="10" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#2c3e50">Encryption</text>
    <line x1="-40" y1="20" x2="-100" y2="80" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,3" />
  </g>
  
  <!-- Access Control -->
  <g transform="translate(150, 350)">
    <circle cx="0" cy="0" r="50" fill="#2ecc71" fill-opacity="0.2" stroke="#27ae60" stroke-width="2" />
    <text x="0" y="-10" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#2c3e50">Access</text>
    <text x="0" y="10" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#2c3e50">Control</text>
    <line x1="40" y1="-20" x2="130" y2="-70" stroke="#27ae60" stroke-width="2" stroke-dasharray="5,3" />
  </g>
  
  <!-- Network Security -->
  <g transform="translate(500, 350)">
    <circle cx="0" cy="0" r="50" fill="#f39c12" fill-opacity="0.2" stroke="#d35400" stroke-width="2" />
    <text x="0" y="-10" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#2c3e50">Network</text>
    <text x="0" y="10" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#2c3e50">Security</text>
    <line x1="-40" y1="-20" x2="-130" y2="-70" stroke="#d35400" stroke-width="2" stroke-dasharray="5,3" />
  </g>
  
  <!-- Security Measures -->
  <!-- User Auth Section -->
  <g transform="translate(70, 120)">
    <rect x="0" y="-60" width="90" height="20" rx="5" ry="5" fill="#3498db" fill-opacity="0.6" />
    <text x="45" y="-46" font-family="Arial" font-size="10" text-anchor="middle" fill="white">Password Hashing</text>
    
    <rect x="0" y="-30" width="90" height="20" rx="5" ry="5" fill="#3498db" fill-opacity="0.6" />
    <text x="45" y="-16" font-family="Arial" font-size="10" text-anchor="middle" fill="white">2FA Authentication</text>
    
    <rect x="0" y="0" width="90" height="20" rx="5" ry="5" fill="#3498db" fill-opacity="0.6" />
    <text x="45" y="14" font-family="Arial" font-size="10" text-anchor="middle" fill="white">Account Lockout</text>
    
    <rect x="0" y="30" width="90" height="20" rx="5" ry="5" fill="#3498db" fill-opacity="0.6" />
    <text x="45" y="44" font-family="Arial" font-size="10" text-anchor="middle" fill="white">Session Management</text>
  </g>
  
  <!-- Data Encryption Section -->
  <g transform="translate(540, 120)">
    <rect x="0" y="-60" width="90" height="20" rx="5" ry="5" fill="#e74c3c" fill-opacity="0.6" />
    <text x="45" y="-46" font-family="Arial" font-size="10" text-anchor="middle" fill="white">AES-256 Encryption</text>
    
    <rect x="0" y="-30" width="90" height="20" rx="5" ry="5" fill="#e74c3c" fill-opacity="0.6" />
    <text x="45" y="-16" font-family="Arial" font-size="10" text-anchor="middle" fill="white">Key Management</text>
    
    <rect x="0" y="0" width="90" height="20" rx="5" ry="5" fill="#e74c3c" fill-opacity="0.6" />
    <text x="45" y="14" font-family="Arial" font-size="10" text-anchor="middle" fill="white">Encrypted Backups</text>
    
    <rect x="0" y="30" width="90" height="20" rx="5" ry="5" fill="#e74c3c" fill-opacity="0.6" />
    <text x="45" y="44" font-family="Arial" font-size="10" text-anchor="middle" fill="white">Data Masking</text>
  </g>
  
  <!-- Access Control Section -->
  <g transform="translate(50, 350)">
    <rect x="0" y="-60" width="90" height="20" rx="5" ry="5" fill="#2ecc71" fill-opacity="0.6" />
    <text x="45" y="-46" font-family="Arial" font-size="10" text-anchor="middle" fill="white">Role-Based Access</text>
    
    <rect x="0" y="-30" width="90" height="20" rx="5" ry="5" fill="#2ecc71" fill-opacity="0.6" />
    <text x="45" y="-16" font-family="Arial" font-size="10" text-anchor="middle" fill="white">Least Privilege</text>
    
    <rect x="0" y="0" width="90" height="20" rx="5" ry="5" fill="#2ecc71" fill-opacity="0.6" />
    <text x="45" y="14" font-family="Arial" font-size="10" text-anchor="middle" fill="white">Activity Logging</text>
    
    <rect x="0" y="30" width="90" height="20" rx="5" ry="5" fill="#2ecc71" fill-opacity="0.6" />
    <text x="45" y="44" font-family="Arial" font-size="10" text-anchor="middle" fill="white">OAuth Integration</text>
  </g>
  
  <!-- Network Security Section -->
  <g transform="translate(560, 350)">
    <rect x="0" y="-60" width="90" height="20" rx="5" ry="5" fill="#f39c12" fill-opacity="0.6" />
    <text x="45" y="-46" font-family="Arial" font-size="10" text-anchor="middle" fill="white">TLS 1.3 Protocol</text>
    
    <rect x="0" y="-30" width="90" height="20" rx="5" ry="5" fill="#f39c12" fill-opacity="0.6" />
    <text x="45" y="-16" font-family="Arial" font-size="10" text-anchor="middle" fill="white">Firewall Protection</text>
    
    <rect x="0" y="0" width="90" height="20" rx="5" ry="5" fill="#f39c12" fill-opacity="0.6" />
    <text x="45" y="14" font-family="Arial" font-size="10" text-anchor="middle" fill="white">DDoS Mitigation</text>
    
    <rect x="0" y="30" width="90" height="20" rx="5" ry="5" fill="#f39c12" fill-opacity="0.6" />
    <text x="45" y="44" font-family="Arial" font-size="10" text-anchor="middle" fill="white">VPN Access</text>
  </g>
  
  <!-- Compliance Badges -->
  <g transform="translate(350, 450)">
    <circle cx="-100" cy="0" r="20" fill="#9b59b6" fill-opacity="0.6" stroke="#8e44ad" stroke-width="2" />
    <text x="-100" y="4" font-family="Arial" font-size="10" text-anchor="middle" fill="white">PCI</text>
    
    <circle cx="-50" cy="0" r="20" fill="#9b59b6" fill-opacity="0.6" stroke="#8e44ad" stroke-width="2" />
    <text x="-50" y="4" font-family="Arial" font-size="10" text-anchor="middle" fill="white">GDPR</text>
    
    <circle cx="0" cy="0" r="20" fill="#9b59b6" fill-opacity="0.6" stroke="#8e44ad" stroke-width="2" />
    <text x="0" y="4" font-family="Arial" font-size="10" text-anchor="middle" fill="white">ISO</text>
    
    <circle cx="50" cy="0" r="20" fill="#9b59b6" fill-opacity="0.6" stroke="#8e44ad" stroke-width="2" />
    <text x="50" y="4" font-family="Arial" font-size="10" text-anchor="middle" fill="white">SOC2</text>
    
    <circle cx="100" cy="0" r="20" fill="#9b59b6" fill-opacity="0.6" stroke="#8e44ad" stroke-width="2" />
    <text x="100" y="4" font-family="Arial" font-size="10" text-anchor="middle" fill="white">HIPAA</text>
  </g>
</svg>