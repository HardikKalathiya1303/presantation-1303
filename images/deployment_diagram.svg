<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold" fill="#2c3e50">ShopSleek Deployment Architecture</text>
  
  <!-- Cloud Environment (HostingRaja) -->
  <path d="M100,100 C60,100 50,140 70,160 C30,180 40,240 80,240 C80,270 110,290 140,270 C170,310 230,310 260,270 C300,290 350,270 340,220 C380,190 350,130 310,130 C310,100 270,70 240,100 C220,70 160,70 140,100 C120,80 100,80 100,100" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" />
  
  <text x="200" y="190" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold" fill="#3498db">HostingRaja Cloud</text>
  
  <!-- Load Balancer -->
  <g transform="translate(450, 130)">
    <rect x="-60" y="-25" width="120" height="50" rx="5" ry="5" fill="#3498db" fill-opacity="0.7" stroke="#2980b9" stroke-width="2" />
    <text x="0" y="5" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="white">Nginx Load Balancer</text>
    
    <!-- Connections from Load Balancer to App Servers -->
    <line x1="0" y1="25" x2="-100" y2="100" stroke="#2c3e50" stroke-width="2" />
    <line x1="0" y1="25" x2="0" y2="100" stroke="#2c3e50" stroke-width="2" />
    <line x1="0" y1="25" x2="100" y2="100" stroke="#2c3e50" stroke-width="2" />
  </g>
  
  <!-- Application Servers -->
  <g transform="translate(350, 250)">
    <rect x="-60" y="-25" width="120" height="50" rx="5" ry="5" fill="#2ecc71" fill-opacity="0.7" stroke="#27ae60" stroke-width="2" />
    <text x="0" y="-5" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="white">App Server 1</text>
    <text x="0" y="10" font-family="Arial" font-size="10" text-anchor="middle" fill="white">Node.js + Express</text>
    
    <!-- Connection to Database -->
    <line x1="0" y1="25" x2="-50" y2="100" stroke="#2c3e50" stroke-width="2" />
    <!-- Connection to Redis -->
    <line x1="0" y1="25" x2="50" y2="100" stroke="#2c3e50" stroke-width="2" />
  </g>
  
  <g transform="translate(450, 250)">
    <rect x="-60" y="-25" width="120" height="50" rx="5" ry="5" fill="#2ecc71" fill-opacity="0.7" stroke="#27ae60" stroke-width="2" />
    <text x="0" y="-5" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="white">App Server 2</text>
    <text x="0" y="10" font-family="Arial" font-size="10" text-anchor="middle" fill="white">Node.js + Express</text>
    
    <!-- Connection to Database -->
    <line x1="0" y1="25" x2="-50" y2="100" stroke="#2c3e50" stroke-width="2" />
    <!-- Connection to Redis -->
    <line x1="0" y1="25" x2="50" y2="100" stroke="#2c3e50" stroke-width="2" />
  </g>
  
  <g transform="translate(550, 250)">
    <rect x="-60" y="-25" width="120" height="50" rx="5" ry="5" fill="#2ecc71" fill-opacity="0.7" stroke="#27ae60" stroke-width="2" />
    <text x="0" y="-5" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="white">App Server 3</text>
    <text x="0" y="10" font-family="Arial" font-size="10" text-anchor="middle" fill="white">Node.js + Express</text>
    
    <!-- Connection to Database -->
    <line x1="0" y1="25" x2="-50" y2="100" stroke="#2c3e50" stroke-width="2" />
    <!-- Connection to Redis -->
    <line x1="0" y1="25" x2="50" y2="100" stroke="#2c3e50" stroke-width="2" />
  </g>
  
  <!-- Database Servers -->
  <g transform="translate(370, 380)">
    <rect x="-80" y="-30" width="160" height="60" rx="5" ry="5" fill="#e74c3c" fill-opacity="0.7" stroke="#c0392b" stroke-width="2" />
    <text x="0" y="-10" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="white">MySQL Database</text>
    <text x="0" y="10" font-family="Arial" font-size="10" text-anchor="middle" fill="white">Master-Slave Replication</text>
    
    <!-- Database Connections -->
    <line x1="-40" y1="30" x2="-80" y2="100" stroke="#2c3e50" stroke-width="2" />
    <line x1="40" y1="30" x2="80" y2="100" stroke="#2c3e50" stroke-width="2" />
  </g>
  
  <g transform="translate(290, 500)">
    <rect x="-60" y="-25" width="120" height="50" rx="5" ry="5" fill="#e74c3c" fill-opacity="0.5" stroke="#c0392b" stroke-width="2" />
    <text x="0" y="5" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="white">Master DB</text>
  </g>
  
  <g transform="translate(450, 500)">
    <rect x="-60" y="-25" width="120" height="50" rx="5" ry="5" fill="#e74c3c" fill-opacity="0.3" stroke="#c0392b" stroke-width="2" />
    <text x="0" y="5" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="white">Slave DB</text>
  </g>
  
  <!-- Redis Cache -->
  <g transform="translate(530, 380)">
    <rect x="-60" y="-25" width="120" height="50" rx="5" ry="5" fill="#f39c12" fill-opacity="0.7" stroke="#d35400" stroke-width="2" />
    <text x="0" y="-5" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="white">Redis Cache</text>
    <text x="0" y="10" font-family="Arial" font-size="10" text-anchor="middle" fill="white">Session & Data Caching</text>
  </g>
  
  <!-- File Storage -->
  <g transform="translate(650, 380)">
    <rect x="-60" y="-25" width="120" height="50" rx="5" ry="5" fill="#9b59b6" fill-opacity="0.7" stroke="#8e44ad" stroke-width="2" />
    <text x="0" y="5" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="white">File Storage</text>
  </g>
  
  <!-- Monitoring System -->
  <g transform="translate(170, 270)">
    <rect x="-60" y="-25" width="120" height="50" rx="5" ry="5" fill="#1abc9c" fill-opacity="0.7" stroke="#16a085" stroke-width="2" />
    <text x="0" y="-5" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="white">Monitoring</text>
    <text x="0" y="10" font-family="Arial" font-size="10" text-anchor="middle" fill="white">ELK Stack</text>
    
    <!-- Monitoring Connections -->
    <path d="M60,0 C150,0 150,60 240,60" fill="none" stroke="#16a085" stroke-width="2" stroke-dasharray="5,3" />
    <path d="M60,0 C180,0 180,110 240,110" fill="none" stroke="#16a085" stroke-width="2" stroke-dasharray="5,3" />
    <path d="M60,0 C200,0 200,180 240,180" fill="none" stroke="#16a085" stroke-width="2" stroke-dasharray="5,3" />
  </g>
  
  <!-- Backup System -->
  <g transform="translate(170, 350)">
    <rect x="-60" y="-25" width="120" height="50" rx="5" ry="5" fill="#34495e" fill-opacity="0.7" stroke="#2c3e50" stroke-width="2" />
    <text x="0" y="5" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="white">Backup System</text>
    
    <!-- Backup Connection -->
    <path d="M60,0 C180,0 180,30 240,30" fill="none" stroke="#2c3e50" stroke-width="2" stroke-dasharray="5,3" />
  </g>
  
  <!-- Internet Connection -->
  <g transform="translate(450, 50)">
    <path d="M-30,-20 L30,-20 L30,20 L-30,20 Z" fill="#3498db" fill-opacity="0.3" stroke="#2980b9" stroke-width="2" />
    <text x="0" y="5" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#2c3e50">Internet</text>
    
    <!-- Connection to Load Balancer -->
    <line x1="0" y1="20" x2="0" y2="60" stroke="#2c3e50" stroke-width="2" stroke-dasharray="5,3" />
  </g>
  
  <!-- Legend -->
  <g transform="translate(720, 200)">
    <rect x="-70" y="-10" width="20" height="20" fill="#3498db" fill-opacity="0.7" />
    <text x="-40" y="3" font-family="Arial" font-size="10" text-anchor="start" fill="#2c3e50">Load Balancer</text>
    
    <rect x="-70" y="20" width="20" height="20" fill="#2ecc71" fill-opacity="0.7" />
    <text x="-40" y="33" font-family="Arial" font-size="10" text-anchor="start" fill="#2c3e50">App Servers</text>
    
    <rect x="-70" y="50" width="20" height="20" fill="#e74c3c" fill-opacity="0.7" />
    <text x="-40" y="63" font-family="Arial" font-size="10" text-anchor="start" fill="#2c3e50">Database</text>
    
    <rect x="-70" y="80" width="20" height="20" fill="#f39c12" fill-opacity="0.7" />
    <text x="-40" y="93" font-family="Arial" font-size="10" text-anchor="start" fill="#2c3e50">Redis Cache</text>
    
    <rect x="-70" y="110" width="20" height="20" fill="#9b59b6" fill-opacity="0.7" />
    <text x="-40" y="123" font-family="Arial" font-size="10" text-anchor="start" fill="#2c3e50">File Storage</text>
    
    <rect x="-70" y="140" width="20" height="20" fill="#1abc9c" fill-opacity="0.7" />
    <text x="-40" y="153" font-family="Arial" font-size="10" text-anchor="start" fill="#2c3e50">Monitoring</text>
    
    <rect x="-70" y="170" width="20" height="20" fill="#34495e" fill-opacity="0.7" />
    <text x="-40" y="183" font-family="Arial" font-size="10" text-anchor="start" fill="#2c3e50">Backup System</text>
  </g>
</svg>