<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="700" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="700" height="600" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="350" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold" fill="#2c3e50">ShopSleek Key Features</text>
  
  <!-- Feature Icons and Descriptions -->
  <!-- UI Feature -->
  <g transform="translate(350, 130)">
    <circle cx="0" cy="0" r="40" fill="#3498db" fill-opacity="0.2" stroke="#2980b9" stroke-width="2" />
    <text x="0" y="5" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#2c3e50">UI</text>
    
    <!-- UI Icon Elements -->
    <rect x="-15" y="-10" width="30" height="5" fill="#2980b9" />
    <rect x="-15" y="0" width="20" height="5" fill="#2980b9" />
    <rect x="-15" y="10" width="25" height="5" fill="#2980b9" />
  </g>
  
  <!-- Search Feature -->
  <g transform="translate(200, 200)">
    <circle cx="0" cy="0" r="40" fill="#2ecc71" fill-opacity="0.2" stroke="#27ae60" stroke-width="2" />
    <text x="0" y="5" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#2c3e50">Search</text>
    
    <!-- Search Icon Elements -->
    <circle cx="-5" cy="-5" r="15" fill="none" stroke="#27ae60" stroke-width="2" />
    <line x1="5" y1="5" x2="15" y2="15" stroke="#27ae60" stroke-width="3" />
  </g>
  
  <!-- Payment Feature -->
  <g transform="translate(500, 200)">
    <circle cx="0" cy="0" r="40" fill="#e74c3c" fill-opacity="0.2" stroke="#c0392b" stroke-width="2" />
    <text x="0" y="5" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold" fill="#2c3e50">Payment</text>
    
    <!-- Payment Icon Elements -->
    <rect x="-15" y="-5" width="30" height="20" rx="2" ry="2" fill="none" stroke="#c0392b" stroke-width="2" />
    <line x1="-15" y1="2" x2="15" y2="2" stroke="#c0392b" stroke-width="2" />
  </g>
  
  <!-- Order Management Feature -->
  <g transform="translate(150, 350)">
    <circle cx="0" cy="0" r="40" fill="#f39c12" fill-opacity="0.2" stroke="#d35400" stroke-width="2" />
    <text x="0" y="-5" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#2c3e50">Order</text>
    <text x="0" y="10" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#2c3e50">Mgmt</text>
    
    <!-- Order Icon Elements -->
    <rect x="-15" y="-15" width="30" height="5" fill="#d35400" />
    <rect x="-15" y="-5" width="25" height="5" fill="#d35400" />
    <rect x="-15" y="5" width="20" height="5" fill="#d35400" />
    <rect x="-15" y="15" width="15" height="5" fill="#d35400" />
  </g>
  
  <!-- User Accounts Feature -->
  <g transform="translate(350, 350)">
    <circle cx="0" cy="0" r="40" fill="#9b59b6" fill-opacity="0.2" stroke="#8e44ad" stroke-width="2" />
    <text x="0" y="-5" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#2c3e50">User</text>
    <text x="0" y="10" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#2c3e50">Accounts</text>
    
    <!-- User Icon Elements -->
    <circle cx="0" cy="-8" r="10" fill="none" stroke="#8e44ad" stroke-width="2" />
    <path d="M-10,5 C-10,15 10,15 10,5" fill="none" stroke="#8e44ad" stroke-width="2" />
  </g>
  
  <!-- Admin Dashboard Feature -->
  <g transform="translate(550, 350)">
    <circle cx="0" cy="0" r="40" fill="#1abc9c" fill-opacity="0.2" stroke="#16a085" stroke-width="2" />
    <text x="0" y="-5" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#2c3e50">Admin</text>
    <text x="0" y="10" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#2c3e50">Dashboard</text>
    
    <!-- Admin Icon Elements -->
    <rect x="-15" y="-15" width="30" height="10" fill="none" stroke="#16a085" stroke-width="2" />
    <rect x="-15" y="0" width="10" height="10" fill="none" stroke="#16a085" stroke-width="2" />
    <rect x="0" y="0" width="15" height="10" fill="none" stroke="#16a085" stroke-width="2" />
  </g>
  
  <!-- Analytics Feature -->
  <g transform="translate(350, 470)">
    <circle cx="0" cy="0" r="40" fill="#34495e" fill-opacity="0.2" stroke="#2c3e50" stroke-width="2" />
    <text x="0" y="-5" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#2c3e50">Analytics</text>
    <text x="0" y="10" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#2c3e50">Reporting</text>
    
    <!-- Analytics Icon Elements -->
    <line x1="-15" y1="15" x2="-15" y2="-15" stroke="#2c3e50" stroke-width="2" />
    <line x1="-15" y1="15" x2="15" y2="15" stroke="#2c3e50" stroke-width="2" />
    <line x1="-10" y1="5" x2="-5" y2="-5" stroke="#2c3e50" stroke-width="2" />
    <line x1="-5" y1="-5" x2="0" y2="0" stroke="#2c3e50" stroke-width="2" />
    <line x1="0" y1="0" x2="5" y2="-10" stroke="#2c3e50" stroke-width="2" />
    <line x1="5" y1="-10" x2="10" y2="5" stroke="#2c3e50" stroke-width="2" />
  </g>
  
  <!-- Feature Descriptions -->
  <!-- UI Description -->
  <g transform="translate(350, 130)">
    <path d="M40,0 L90,0" stroke="#2980b9" stroke-width="2" />
    <rect x="100" y="-40" width="200" height="80" rx="10" ry="10" fill="#3498db" fill-opacity="0.1" stroke="#2980b9" stroke-width="1" />
    <text x="200" y="-20" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#2c3e50">Intuitive User Interface</text>
    <text x="200" y="0" font-family="Arial" font-size="10" text-anchor="middle" fill="#2c3e50">Clean, responsive design optimized</text>
    <text x="200" y="15" font-family="Arial" font-size="10" text-anchor="middle" fill="#2c3e50">for all devices with thoughtful</text>
    <text x="200" y="30" font-family="Arial" font-size="10" text-anchor="middle" fill="#2c3e50">navigation and minimal friction.</text>
  </g>
  
  <!-- Search Description -->
  <g transform="translate(200, 200)">
    <path d="M-40,0 L-90,0" stroke="#27ae60" stroke-width="2" />
    <rect x="-290" y="-40" width="200" height="80" rx="10" ry="10" fill="#2ecc71" fill-opacity="0.1" stroke="#27ae60" stroke-width="1" />
    <text x="-190" y="-20" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#2c3e50">Advanced Search & Filtering</text>
    <text x="-190" y="0" font-family="Arial" font-size="10" text-anchor="middle" fill="#2c3e50">Find products quickly with dynamic</text>
    <text x="-190" y="15" font-family="Arial" font-size="10" text-anchor="middle" fill="#2c3e50">filtering that includes category</text>
    <text x="-190" y="30" font-family="Arial" font-size="10" text-anchor="middle" fill="#2c3e50">browsing and price range filters.</text>
  </g>
  
  <!-- Payment Description -->
  <g transform="translate(500, 200)">
    <path d="M40,0 L90,0" stroke="#c0392b" stroke-width="2" />
    <rect x="100" y="-40" width="200" height="80" rx="10" ry="10" fill="#e74c3c" fill-opacity="0.1" stroke="#c0392b" stroke-width="1" />
    <text x="200" y="-20" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#2c3e50">Secure Payment Processing</text>
    <text x="200" y="0" font-family="Arial" font-size="10" text-anchor="middle" fill="#2c3e50">PCI-DSS compliant gateway with</text>
    <text x="200" y="15" font-family="Arial" font-size="10" text-anchor="middle" fill="#2c3e50">multiple payment methods including</text>
    <text x="200" y="30" font-family="Arial" font-size="10" text-anchor="middle" fill="#2c3e50">credit cards and digital wallets.</text>
  </g>
  
  <!-- Order Management Description -->
  <g transform="translate(150, 350)">
    <path d="M-40,0 L-90,0" stroke="#d35400" stroke-width="2" />
    <rect x="-290" y="-40" width="200" height="80" rx="10" ry="10" fill="#f39c12" fill-opacity="0.1" stroke="#d35400" stroke-width="1" />
    <text x="-190" y="-20" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#2c3e50">Order Management</text>
    <text x="-190" y="0" font-family="Arial" font-size="10" text-anchor="middle" fill="#2c3e50">Track orders from placement to</text>
    <text x="-190" y="15" font-family="Arial" font-size="10" text-anchor="middle" fill="#2c3e50">delivery with real-time updates</text>
    <text x="-190" y="30" font-family="Arial" font-size="10" text-anchor="middle" fill="#2c3e50">and notifications for all users.</text>
  </g>
  
  <!-- Analytics Description -->
  <g transform="translate(350, 470)">
    <path d="M40,0 L90,0" stroke="#2c3e50" stroke-width="2" />
    <rect x="100" y="-40" width="200" height="80" rx="10" ry="10" fill="#34495e" fill-opacity="0.1" stroke="#2c3e50" stroke-width="1" />
    <text x="200" y="-20" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#2c3e50">Analytics & Reporting</text>
    <text x="200" y="0" font-family="Arial" font-size="10" text-anchor="middle" fill="#2c3e50">Comprehensive sales reports, user</text>
    <text x="200" y="15" font-family="Arial" font-size="10" text-anchor="middle" fill="#2c3e50">activity tracking, and inventory level</text>
    <text x="200" y="30" font-family="Arial" font-size="10" text-anchor="middle" fill="#2c3e50">monitoring with visual data views.</text>
  </g>
  
  <!-- Feature Connections -->
  <g>
    <path d="M350,170 L300,170 C250,170 250,200 200,200" stroke="#34495e" stroke-width="1" stroke-dasharray="5,3" fill="none" />
    <path d="M350,170 L400,170 C450,170 450,200 500,200" stroke="#34495e" stroke-width="1" stroke-dasharray="5,3" fill="none" />
    <path d="M200,240 L200,300 C200,330 170,330 150,350" stroke="#34495e" stroke-width="1" stroke-dasharray="5,3" fill="none" />
    <path d="M500,240 L500,300 C500,330 530,330 550,350" stroke="#34495e" stroke-width="1" stroke-dasharray="5,3" fill="none" />
    <path d="M350,170 L350,300 C350,330 350,330 350,350" stroke="#34495e" stroke-width="1" stroke-dasharray="5,3" fill="none" />
    <path d="M350,390 L350,430" stroke="#34495e" stroke-width="1" stroke-dasharray="5,3" fill="none" />
  </g>
  
  <!-- Statistics -->
  <g transform="translate(350, 560)">
    <rect x="-300" y="-20" width="600" height="40" rx="5" ry="5" fill="#3498db" fill-opacity="0.1" stroke="#2980b9" stroke-width="1" />
    <text x="-250" y="5" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#2c3e50">30% ↑</text>
    <text x="-150" y="5" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">User Satisfaction</text>
    
    <text x="0" y="5" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#2c3e50">45% ↑</text>
    <text x="100" y="5" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">Conversion Rate</text>
    
    <text x="200" y="5" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold" fill="#2c3e50">60% ↓</text>
    <text x="300" y="5" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">Cart Abandonment</text>
  </g>
</svg>