<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="300" y="40" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold" fill="#2c3e50">Test Results Summary</text>
  
  <!-- Bar Chart -->
  <g transform="translate(50, 80)">
    <!-- Y-axis -->
    <line x1="0" y1="0" x2="0" y2="250" stroke="#34495e" stroke-width="2" />
    <!-- X-axis -->
    <line x1="0" y1="250" x2="500" y2="250" stroke="#34495e" stroke-width="2" />
    
    <!-- Y-axis labels -->
    <text x="-10" y="0" font-family="Arial" font-size="12" text-anchor="end" dominant-baseline="middle" fill="#2c3e50">100%</text>
    <text x="-10" y="50" font-family="Arial" font-size="12" text-anchor="end" dominant-baseline="middle" fill="#2c3e50">80%</text>
    <text x="-10" y="100" font-family="Arial" font-size="12" text-anchor="end" dominant-baseline="middle" fill="#2c3e50">60%</text>
    <text x="-10" y="150" font-family="Arial" font-size="12" text-anchor="end" dominant-baseline="middle" fill="#2c3e50">40%</text>
    <text x="-10" y="200" font-family="Arial" font-size="12" text-anchor="end" dominant-baseline="middle" fill="#2c3e50">20%</text>
    <text x="-10" y="250" font-family="Arial" font-size="12" text-anchor="end" dominant-baseline="middle" fill="#2c3e50">0%</text>
    
    <!-- Grid lines -->
    <line x1="0" y1="0" x2="500" y2="0" stroke="#e0e0e0" stroke-width="1" />
    <line x1="0" y1="50" x2="500" y2="50" stroke="#e0e0e0" stroke-width="1" />
    <line x1="0" y1="100" x2="500" y2="100" stroke="#e0e0e0" stroke-width="1" />
    <line x1="0" y1="150" x2="500" y2="150" stroke="#e0e0e0" stroke-width="1" />
    <line x1="0" y1="200" x2="500" y2="200" stroke="#e0e0e0" stroke-width="1" />
    
    <!-- Bars -->
    <!-- User Authentication: 100% -->
    <rect x="25" y="0" width="60" height="250" fill="#3498db" />
    <text x="55" y="270" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">User Auth</text>
    <text x="55" y="-10" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">100%</text>
    
    <!-- Product Browsing: 83.3% -->
    <rect x="125" y="41.75" width="60" height="208.25" fill="#2ecc71" />
    <text x="155" y="270" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">Product</text>
    <text x="155" y="31.75" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">83.3%</text>
    
    <!-- Shopping & Checkout: 83.3% -->
    <rect x="225" y="41.75" width="60" height="208.25" fill="#e74c3c" />
    <text x="255" y="270" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">Checkout</text>
    <text x="255" y="31.75" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">83.3%</text>
    
    <!-- Admin Functions: 87.5% -->
    <rect x="325" y="31.25" width="60" height="218.75" fill="#f39c12" />
    <text x="355" y="270" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">Admin</text>
    <text x="355" y="21.25" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">87.5%</text>
    
    <!-- API Endpoints: 90% -->
    <rect x="425" y="25" width="60" height="225" fill="#9b59b6" />
    <text x="455" y="270" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">API</text>
    <text x="455" y="15" font-family="Arial" font-size="12" text-anchor="middle" fill="#2c3e50">90%</text>
  </g>
  
  <!-- Legend -->
  <rect x="150" y="350" width="15" height="15" fill="#3498db" />
  <text x="175" y="362" font-family="Arial" font-size="12" fill="#2c3e50">User Authentication</text>
  
  <rect x="300" y="350" width="15" height="15" fill="#2ecc71" />
  <text x="325" y="362" font-family="Arial" font-size="12" fill="#2c3e50">Product Browsing</text>
  
  <rect x="150" y="375" width="15" height="15" fill="#e74c3c" />
  <text x="175" y="387" font-family="Arial" font-size="12" fill="#2c3e50">Shopping & Checkout</text>
  
  <rect x="300" y="375" width="15" height="15" fill="#f39c12" />
  <text x="325" y="387" font-family="Arial" font-size="12" fill="#2c3e50">Admin Functions</text>
  
  <rect x="425" y="350" width="15" height="15" fill="#9b59b6" />
  <text x="450" y="362" font-family="Arial" font-size="12" fill="#2c3e50">API Endpoints</text>
</svg>